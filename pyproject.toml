[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "skilldock"
version = "0.2.0"
description = "Universal Agent Skill MCP runtime with installable sources and a HOT tool tier"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "SkillDock contributors" }]
dependencies = [
  "PyYAML>=6.0.2",
]

[project.scripts]
skilldock = "skill_mcp.cli:main"
skill-mcp = "skill_mcp.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/skill_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --basetemp=.pytest-tmp"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".pytest-tmp", ".codex-tmp"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
